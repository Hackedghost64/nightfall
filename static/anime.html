<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AniLab Web</title>
<style>
:root{
  --bg:#0a0c11;--panel:#12151f;--panel2:#181c29;--line:#242a3b;--txt:#e9ebf4;--dim:#96a0b5;
  --acc:#7c5cff;--acc2:#b18cff;--red:#ff5470;--green:#3ddc97;--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{background:radial-gradient(1200px 500px at 70% -10%,rgba(124,92,255,.09),transparent),var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
img{display:block}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3050;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:10px 22px;background:rgba(10,12,17,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b{color:var(--txt);-webkit-text-fill-color:var(--txt)}
#topbar nav{display:flex;gap:4px}
#topbar nav a{padding:7px 13px;border-radius:99px;color:var(--dim);font-size:14px;font-weight:500}
#topbar nav a:hover{color:var(--txt);background:var(--panel2)}
#topbar nav a.on{color:#fff;background:linear-gradient(90deg,var(--acc),#9d7bff)}
#searchForm{display:flex;margin-left:auto;min-width:240px;flex:0 1 380px}
#searchForm input{flex:1;background:var(--panel);border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;padding:8px 14px;outline:none;color:var(--txt)}
#searchForm input:focus{border-color:var(--acc)}
#searchForm button{background:linear-gradient(90deg,var(--acc),#9d7bff);border:0;border-radius:0 10px 10px 0;padding:8px 16px;cursor:pointer;font-weight:600}

main{max-width:1300px;margin:0 auto;padding:22px}
.footer{max-width:1300px;margin:30px auto 40px;padding:0 22px;color:var(--dim);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer a{color:var(--dim);text-decoration:underline}

.hero{display:flex;gap:26px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:34px;align-items:center;flex-wrap:wrap}
.hero img{width:210px;border-radius:var(--r);box-shadow:0 14px 44px rgba(0,0,0,.55)}
.hero h1{font-size:30px;line-height:1.2;margin-bottom:6px}
.hero .ov{color:var(--dim);max-width:640px;margin-top:12px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim);margin:2px 4px 2px 0}
.tag.acc{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--acc),#9d7bff)}
.tag.demo{color:#ffd166;border-color:#5a4a12}

.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 14px;font-size:19px;font-weight:700}
.sec-title::before{content:"";width:4px;height:20px;border-radius:4px;background:linear-gradient(var(--acc),var(--acc2))}
.row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.row .card{flex:0 0 152px;scroll-snap-align:start}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}
.card{display:block;border-radius:var(--r);transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card .ph{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover}
.card .tt{margin-top:8px;font-size:13.5px;font-weight:600;line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .sub{font-size:12px;color:var(--dim);margin-top:2px}
.score{position:absolute;top:8px;right:8px;background:rgba(8,10,16,.85);border:1px solid var(--line);padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#ffd166}

.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0 6px}
.pager button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 18px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{color:var(--dim)}

.detail{display:flex;gap:30px;flex-wrap:wrap;margin-top:8px}
.detail .poster{width:240px;flex:0 0 auto}
.detail .poster img{width:100%;border-radius:var(--r);border:1px solid var(--line);box-shadow:0 14px 44px rgba(0,0,0,.5)}
.detail .info{flex:1;min-width:300px}
.detail h1{font-size:28px;line-height:1.25;margin:4px 0 10px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:16px 0;font-size:14px}
.meta dt{color:var(--dim)}
.ovfull{color:#c6cbdb;white-space:pre-wrap;margin:14px 0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 20px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:linear-gradient(90deg,var(--acc),#9d7bff);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.saved{border-color:var(--acc);color:var(--acc2)}
.chips{margin:8px 0 4px}
.back{color:var(--dim);font-size:13.5px;display:inline-block;margin-bottom:14px}
.back:hover{color:var(--txt)}

.watch{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start;margin-top:6px}
.stage{min-width:0}
.playerBox{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.vlcBox{padding:28px;text-align:center;max-width:560px}
.vlcBox h3{font-size:20px;margin-bottom:8px}
.vlcBox .url{word-break:break-all;font-size:11.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:12px 0}
.pmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--dim);background:rgba(8,10,15,.72);padding:20px;z-index:5}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #2c3150;border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{border:1px solid #58263a;background:#1d1220;border-radius:12px;padding:16px;max-width:430px;text-align:left}
.errbox b{color:var(--red)}
.errbox .btnrow{margin:12px 0 0}
.pctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pctrl select,.mini{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
.mini:hover{border-color:var(--acc)}
.status{color:var(--dim);font-size:13px;margin-left:auto}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:10px}
.srvgrp{margin-bottom:10px}
.srvgrp:last-child{margin-bottom:0}
.srvgrp .lbl{font-size:12px;font-weight:700;margin-bottom:6px;color:var(--acc2)}
.srv{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 12px;margin:0 6px 6px 0;cursor:pointer;font-size:13px}
.srv:hover{border-color:var(--acc)}
.srv.on{background:linear-gradient(90deg,var(--acc),#9d7bff);border-color:transparent;color:#fff;font-weight:600}
.eplist{max-height:430px;overflow-y:auto;margin:0 -6px}
.epitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--txt)}
.epitem:hover{background:var(--panel2)}
.epitem.on{border-left-color:var(--acc);background:var(--panel2);font-weight:600}
.epitem .n{color:var(--dim);font-size:12.5px;flex:0 0 auto}
.epitem.seen .t{opacity:.5}
.epitem.seen::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
.empty{color:var(--dim);text-align:center;padding:60px 0;font-size:15px}
.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--panel2) 40%,#20263a 50%,var(--panel2) 60%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.skcard{aspect-ratio:2/3}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1c2030;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 18px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.catcloud{display:flex;flex-wrap:wrap;gap:10px}
.cats{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:99px;cursor:pointer}
.cats:hover{border-color:var(--acc);color:var(--acc2)}
@media(max-width:980px){
  .watch{grid-template-columns:1fr}
  .hero{padding:18px}.hero img{width:150px}
  #searchForm{order:3;flex-basis:100%;margin-left:0}
}
</style>
</head>
<body>
<header id="topbar">
  <a class="logo" href="#/home">🌙 NIGHT<b>FALL</b> · ANIME</a><span style="font-size:11px;color:var(--dim);border:1px solid var(--line);padding:2px 8px;border-radius:99px">via :8399 gateway</span>
  <nav>
    <a href="#/home" data-nav="home">Home</a>
    <a href="#/latest" data-nav="latest">Latest</a>
    <a href="#/categories" data-nav="categories">Categories</a>
    <a href="#/mylist" data-nav="mylist">My List</a>
  </nav>
  <form id="searchForm">
    <input id="q" type="search" placeholder="Search anime..." autocomplete="off">
    <button type="submit">Search</button>
  </form>
</header>
<main id="view"><div class="empty">Loading...</div></main>
<div class="footer">
  <span>🌙 Nightfall Proxy Mode — data via :8399/anime (no Cloudflare challenges) · For personal use only.</span>
  <a href="#" onclick="location.reload();return false">Reload app</a>
</div>
<div id="toasts"></div>
<script>
'use strict';
const ANILAB_BASE=location.origin+'/anime'; // proxied via Nightfall :8399
const KYOTO_BASE=location.origin+'/anime'; // Kyoto routes also proxied (episodes/servers/stream via gateway)
const GW_KEY=localStorage.getItem('nightfall_api_key')||'';
const H_ANILAB={'Accept':'application/json','Content-Type':'application/json','os-version':'35','app-id':'com.xo.anilab','app-version':'105','os-id':'',...(GW_KEY?{'x-api-key':GW_KEY}:{})};
const H_KYOTO={'Accept':'application/json','Content-Type':'application/json','os-version':'35','app-id':'com.kyotoplayer','app-version':'126',...(GW_KEY?{'x-api-key':GW_KEY}:{})};
const LS_LIST='anilab.mylist.v1', LS_PROG='anilab.progress.v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^(https?:|data:image)/.test(String(u)) ? u : ''; // Prevent javascript: XSS
const VIEW=$('#view');
let cleanupFn=null;

function toast(msg,ms=3200){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(),ms);
}
function fmtTime(s){
  s=Math.max(0,Math.floor(s||0));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');
  return h?`${h}:${p(m)}:${p(x)}`:`${m}:${p(x)}`;
}
const isChallenge=t=>/just a moment|cf-chl|challenge-platform|attention required|cf-error/i.test(String(t));

// LRU Cache implementation to prevent memory leaks
function LRU(max=100){
  const m=new Map();
  return {
    has:k=>m.has(k),
    get:k=>{const v=m.get(k);if(v!==undefined){m.delete(k);m.set(k,v);}return v;},
    set:(k,v)=>{if(m.has(k))m.delete(k);else if(m.size>=max)m.delete(m.keys().next().value);m.set(k,v);}
  };
}

const warmed=new Map();
function warmup(origin){
  if(warmed.has(origin))return warmed.get(origin);
  const p=new Promise(res=>{
    const f=document.createElement('iframe');
    f.style.cssText='position:fixed;width:2px;height:2px;left:-9999px;top:0;border:0;opacity:0';
    f.referrerPolicy='no-referrer';
    f.src=origin+'/favicon.ico';
    const done=()=>{ setTimeout(()=>{ f.remove(); res(); }, 2200); }; // Clean up iframe
    f.addEventListener('load',done);
    f.addEventListener('error',done);
    document.body.appendChild(f);
    setTimeout(()=>{ f.remove(); res(); }, 8000);
  });
  warmed.set(origin,p);
  return p;
}

async function httpGet(url,hdrs){
  const origin=new URL(url).origin;
  let lastTxt='';
  for(let i=0;i<3;i++){
    let res;
    try{
      res=await fetch(url,{headers:hdrs||undefined,credentials:'omit',referrerPolicy:'no-referrer'});
    }catch(e){
      await warmup(origin);
      continue;
    }
    if(res.status===403||res.status===503){
      lastTxt=await res.text().catch(()=>'');
      if(isChallenge(lastTxt)){
        await warmup(origin);
        continue;
      }
      throw new Error(`HTTP ${res.status}`);
    }
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    return await res.text();
  }
  const c=isChallenge(lastTxt)?'Blocked by Cloudflare challenge. Try the retry button, or open the site once in a tab and come back.':'Network request failed repeatedly.';
  throw new Error(c);
}
async function getJSON(url,hdrs){
  const t=await httpGet(url,hdrs);
  try{return JSON.parse(t);}
  catch(e){
    if(isChallenge(t))throw new Error('Cloudflare challenge intercepted the response.');
    throw new Error('Invalid JSON from '+new URL(url).hostname);
  }
}

const api={
  home:()=>getJSON(`${ANILAB_BASE}/home`,H_ANILAB), // nightfall: GET /anime/home
  latest:p=>getJSON(`${ANILAB_BASE}/latest?page=${p}`,H_ANILAB),
  search:(q,p)=>getJSON(`${ANILAB_BASE}/search?query=${encodeURIComponent(q)}&page=${p}`,H_ANILAB),
  categories:()=>getJSON(`${ANILAB_BASE}/categories`,H_ANILAB),
  category:(id,p)=>getJSON(`${ANILAB_BASE}/category?id=${id}&page=${p}`,H_ANILAB),
  post:id=>getJSON(`${ANILAB_BASE}/post?id=${id}`,H_ANILAB)
};

const routeCache=LRU(20), postCache=LRU(200), streamCache=LRU(50);
// 🌙 Nightfall proxy mode: all Kyoto resolution goes via gateway (no Cloudflare warmup needed)
async function kyotoRoutes(pid){ return {proxy:true,pid}; }
async function fetchEpisodes(pid){
  const d=await getJSON(`${ANILAB_BASE}/post/${encodeURIComponent(pid)}/episodes`, H_ANILAB);
  return (d.episodes||[]).map(e=>({id:String(e.id),num:e.num!=null?e.num:'',name:e.name||''}));
}
async function fetchServers(pid,eid){
  const d=await getJSON(`${ANILAB_BASE}/post/${encodeURIComponent(pid)}/servers/${encodeURIComponent(eid)}`, H_ANILAB);
  return (d.servers||[]).map(s=>({id:String(s.id),lang:s.lang==='dub'?'dub':'sub',name:s.name||('Server '+s.id)}));
}
async function resolveStream(pid,sid){
  const key=pid+':'+sid;
  if(streamCache.has(key))return streamCache.get(key);
  const d=await getJSON(`${ANILAB_BASE}/post/${encodeURIComponent(pid)}/stream/${encodeURIComponent(sid)}`, H_ANILAB);
  if(!d.url)throw new Error('Gateway returned no stream url.');
  const out={url:d.url,embed:d.embed,alternates:d.alternates||[d.url]};
  streamCache.set(key,out);
  return out;
}
async function getPostCached(id){
  if(postCache.has(id))return postCache.get(id);
  const p=await api.post(id);
  postCache.set(id,p);
  return p;
}

const myList={
  get(){try{return JSON.parse(localStorage.getItem(LS_LIST))||[]}catch(e){return[]}},
  has(id){return this.get().includes(Number(id))},
  toggle(id){
    let l=this.get();
    l=l.includes(Number(id))?l.filter(x=>x!==Number(id)):l.concat(Number(id));
    localStorage.setItem(LS_LIST,JSON.stringify(l));
    return l.includes(Number(id));
  }
};
const prog={
  all(){try{return JSON.parse(localStorage.getItem(LS_PROG))||{}}catch(e){return{}}},
  get(k){return this.all()[k]},
  set(pid,eid,t,d){
    const a=this.all();
    a[pid+':'+eid]={t:Math.floor(t),d:Math.floor(d)};
    localStorage.setItem(LS_PROG,JSON.stringify(a));
  },
  pct(k){const v=this.get(k);return v&&v.d?v.t/v.d:0}
};

function posterCard(p){
  const id=p.id;
  return `<a class="card" href="#/post/${id}" data-hid="${id}">
    <div class="ph">${p.poster?`<img loading="lazy" src="${esc(safeUrl(p.poster))}" alt="" onerror="this.remove()">`:''}${p.score?`<span class="score">${esc(p.score)}</span>`:''}</div>
    <div class="tt">${esc(p.title||'')}</div>
    ${p.type||p.age?`<div class="sub">${esc([p.type,p.age].filter(Boolean).join(' | '))}</div>`:''}
  </a>`;
}

const hydrateQueue=[];
let hydrateActive=0,cardObserver=null;
function observeCards(){
  if(cardObserver)cardObserver.disconnect();
  cardObserver=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        cardObserver.unobserve(e.target);
        hydrateCard(e.target);
      }
    });
  },{rootMargin:'400px'});
  $$('.card[data-hid]').forEach(c=>cardObserver.observe(c));
}
function hydrateCard(el){
  if(el.dataset.hydrating)return;
  el.dataset.hydrating='1';
  hydrateQueue.push(el);
  pumpHydrate();
}
function pumpHydrate(){
  while(hydrateActive<5&&hydrateQueue.length){
    const el=hydrateQueue.shift();
    if(!el.isConnected) continue; // Skip if removed from DOM
    const id=el.dataset.hid;
    if(postCache.has(id)){
      try { fillCard(el,id); } catch(e) {}
      continue;
    }
    hydrateActive++;
    getPostCached(id)
      .then(()=>{ try { fillCard(el,id); } catch(e) {} })
      .catch(()=>{})
      .finally(()=>{hydrateActive--;pumpHydrate();});
  }
}
function fillCard(el,id){
  if(!el.isConnected)return;
  const p=postCache.get(id);
  if(!p)return;
  const tt=el.querySelector('.tt');
  if(tt)tt.textContent=p.title||'';
  const sub=el.querySelector('.sub');
  const meta=[p.type,p.age].filter(Boolean).join(' | ');
  if(meta){
    if(sub)sub.textContent=meta;
    else el.insertAdjacentHTML('beforeend',`<div class="sub">${esc(meta)}</div>`);
  }
  if(p.score&&!el.querySelector('.score')){
    const ph=el.querySelector('.ph');
    if(ph)ph.insertAdjacentHTML('beforeend',`<span class="score">${esc(p.score)}</span>`);
  }
}
function skGrid(n=10){return `<div class="grid">${'<div class="skel skcard"></div>'.repeat(n)}</div>`}
function pager(base,page,hasNext){
  return `<div class="pager">
    <button id="pgPrev" ${page<=1?'disabled':''}>Prev</button><span>Page ${page}</span><button id="pgNext" ${hasNext?'':'disabled'}>Next</button>
  </div>`;
}
function wirePager(base,page,count,per=30){
  const pv=$('#pgPrev'),nx=$('#pgNext');
  if(pv)pv.onclick=()=>{location.hash=`${base}=${Math.max(1,page-1)}`};
  if(nx)nx.onclick=()=>{location.hash=`${base}=${page+1}`};
  const hasNext = count >= per; // Assume full page means next exists
  if(nx) nx.disabled = !hasNext;
  if(pv) pv.disabled = page <= 1;
  return hasNext;
}

function render(html){
  if(typeof cleanupFn==='function'){try{cleanupFn()}catch(e){}}
  cleanupFn=null;
  if(cardObserver)cardObserver.disconnect();
  VIEW.innerHTML=html;
  window.scrollTo({top:0});
  observeCards();
}
function setActiveNav(seg){
  $$('#topbar nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===seg||(seg==='category'&&a.dataset.nav==='categories')||(seg==='watch'&&a.dataset.nav==='')));
}

async function viewHome(){
  setActiveNav('home');
  render('<div class="sec-title">Featured</div><div class="skel" style="height:260px;border-radius:20px"></div>'+skGrid());
  let d;
  try{d=await api.home();}
  catch(e){render(`<div class="empty">Failed to load home feed.<br><br>${esc(e.message)}<br><br><button class="btn" onclick="route()">Retry</button></div>`);return;}
  const f=d.featured,secs=d.sections||[];
  render(`
    ${f?`<div class="hero">
      <img src="${esc(safeUrl(f.poster))}" alt="" onerror="this.style.visibility='hidden'">
      <div style="flex:1;min-width:280px">
        <span class="tag acc">${esc(f.type||'FEATURED')}</span>
        ${f.score?`<span class="tag">Score ${esc(f.score)}</span>`:''}${f.age?`<span class="tag">${esc(f.age)}</span>`:''}
        <h1>${esc(f.title)}</h1>
        <div class="ov">${esc(f.overview)}</div>
        <div class="btnrow"><a class="btn primary" href="#/post/${f.id}">Open</a><a class="btn" href="#/watch/${f.id}">Watch</a></div>
      </div>
    </div>`:''}
    ${secs.map(s=>`
      <div class="sec-title">${esc(s.name)}</div>
      <div class="row">${(s.posts||[]).map(posterCard).join('')}</div>`).join('')}
  `);
}

async function viewGrid(fetcher,base,page,label){
  setActiveNav(base.slice(2).split('?')[0]);
  render(`<div class="sec-title">${esc(label)}</div>${skGrid()}${pager(base,page,false)}`);
  let d;
  try{d=await fetcher();}
  catch(e){render(`<div class="empty">Failed to load.<br><br>${esc(e.message)}</div>`);return;}
  const posts=d.posts||[];
  render(`<div class="sec-title">${esc(label)}</div>
    ${posts.length?`<div class="grid">${posts.map(posterCard).join('')}</div>`:'<div class="empty">Nothing found.</div>'}
    ${pager(base,page,posts.length>0)}`);
  wirePager(base,page,posts.length,30);
}

async function viewSearch(q,page){
  setActiveNav('');
  $('#q').value=q;
  await viewGrid(()=>api.search(q,page),`#/search?q=${encodeURIComponent(q)}&page`,page,`Results for "${q}"`);
}

async function viewCategory(id,name,page){

async function viewPost(id){
  setActiveNav('');
  render(`<div class="detail"><div class="poster"><div class="skel skcard" style="aspect-ratio:2/3"></div></div><div class="info"><div class="grid"><div class="skel skcard"></div><div class="skel skcard"></div><div class="skel skcard"></div></div></div></div>`);
  let p;
  try{p=await getPostCached(id);}
  catch(e){render(`<div class="empty">Failed to load title.<br><br>${esc(e.message)}</div>`);return;}
  const saved=myList.has(id);
  const seasons=p.seasons||[],rel=p.related||[],sim=p.similar||[];
  document.title=p.title?p.title+' — AniLab Web':'AniLab Web';
  render(`
    <a class="back" href="#/home">&#8592; Back</a>
    <div class="detail">
      <div class="poster"><img src="${esc(safeUrl(p.poster))}" alt="" onerror="this.style.opacity=.2"></div>
      <div class="info">
        <span class="tag acc">${esc(p.type||'')}</span>
        ${p.score?`<span class="tag">Score ${esc(p.score)}</span>`:''}
        ${p.rating?`<span class="tag">Rated ${esc(p.rating)}</span>`:''}
        ${p.age?`<span class="tag">${esc(p.age)}</span>`:''}
        ${p.isDemo?'<span class="tag demo">Demo / preview content</span>':''}
        <h1>${esc(p.title)}</h1>
        <div class="chips">${(p.genres||'').split(',').map(g=>g.trim()).filter(Boolean).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>
        <dl class="meta">
          ${p.status?`<dt>Status</dt><dd>${esc(p.status)}</dd>`:''}
          ${p.premiered?`<dt>Premiered</dt><dd>${esc(p.premiered)}</dd>`:''}
          ${p.runtime?`<dt>Runtime</dt><dd>${esc(p.runtime)}</dd>`:''}
          <dt>ID</dt><dd>${esc(p.id)}</dd>
        </dl>
        <div class="ovfull">${esc(p.overview)}</div>
        <div class="btnrow">
          <a class="btn primary" id="btnWatch" href="#/watch/${p.id}">Watch now</a>
          <button class="btn ${saved?'saved':''}" id="btnSave">${saved?'Saved to My List':'Add to My List'}</button>
          <button class="btn" id="btnShare">Share</button>
        </div>
        ${seasons.length?`<div class="sec-title">Seasons / Related entries</div><div class="chips">${seasons.map(s=>`<a class="cats" href="#/post/${s.id}">${esc(s.title||('ID '+s.id))}</a>`).join('')}</div>`:''}
      </div>
    </div>
    ${rel.length?`<div class="sec-title">Related</div><div class="row">${rel.map(posterCard).join('')}</div>`:''}
    ${sim.length?`<div class="sec-title">Similar</div><div class="row">${sim.map(posterCard).join('')}</div>`:''}
  `);
  $('#btnSave').onclick=()=>{
    const on=myList.toggle(id);
    $('#btnSave').classList.toggle('saved',on);
    $('#btnSave').textContent=on?'Saved to My List':'Add to My List';
    toast(on?'Added to My List':'Removed from My List');
  };
  $('#btnShare').onclick=()=>{
    const url=p.share||location.href;
    if(navigator.share){navigator.share({title:p.title,url:url}).catch(()=>{});}
    else copyText(url,'Link copied');
  };
}

function copyText(txt,msg){
  const done=()=>toast(msg||'Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  }else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Copy failed');}
    ta.remove();
  }
}

async function viewMyList(){
  setActiveNav('mylist');
  const ids=myList.get();
  if(!ids.length){render('<div class="empty">Your list is empty. Open any title and press "Add to My List".</div>');return;}
  render(`<div class="sec-title">My List (${ids.length})</div>${skGrid(ids.length)}`);
  const settled=await Promise.allSettled(ids.map(i=>getPostCached(i)));
  const posts=settled.filter(s=>s.status==='fulfilled').map(s=>s.value);
  render(`<div class="sec-title">My List (${ids.length})</div>
    ${posts.length?`<div class="grid">${posts.map(posterCard).join('')}</div>`:'<div class="empty">Could not load saved titles.</div>'}`);
}

let W=null,watchToken=0;
function killPlayer(){
  if(W){
    if(W.progTimer){clearInterval(W.progTimer);W.progTimer=null;}
  }
  W=null; // Allow GC
}
function pmsg(html){
  const m=$('.pmsg');
  if(!m)return;
  if(!html){m.style.display='none';m.innerHTML='';return;}
  m.style.display='flex';
  m.innerHTML=html;
}
function pstatus(t){const s=$('#pstat');if(s)s.textContent=t||'';}

async function viewWatch(pid,qs){
  setActiveNav('');
  watchToken++;
  const tk=watchToken;
  killPlayer();
  W={pid:pid,eps:[],curEp:null,srvs:[],curSrv:null,stream:null,pendingSeek:null};
  document.title='Watch — AniLab Web';
  render(`
    <a class="back" id="wBack" href="#/post/${pid}">&#8592; Back to details</a>
    <div id="wTitle" class="sec-title">Loading title...</div>
    <div class="watch">
      <div class="stage">
        <div class="playerBox" id="playerBox">
          <div class="pmsg"><div class="spin"></div><div id="pmtext">Preparing stream...</div></div>
        </div>
        <div class="pctrl">
          <button class="mini" id="btnPrevEp">&#8592; Ep</button>
          <button class="mini" id="btnNextEp">Ep &#8594;</button>
          <span class="status" id="pstat"></span>
        </div>
      </div>
      <aside class="side">
        <div class="panel"><h3>Servers</h3><div id="srvBox"><span style="color:var(--dim)">Loading...</span></div></div>
        <div class="panel"><h3>Episodes</h3><div class="eplist" id="epBox"><span style="color:var(--dim)">Loading...</span></div></div>
      </aside>
    </div>
  `);

  getPostCached(pid).then(p=>{
    if(tk!==watchToken)return;
    $('#wTitle').textContent=p.title||('ID '+pid);
    document.title=(p.title||'Watch')+' — AniLab Web';
  }).catch(()=>{});

  let eps;
  try{eps=await fetchEpisodes(pid);}
  catch(e){if(tk===watchToken)stageFail(e,{retry:()=>viewWatch(pid,qs)});return;}
  if(tk!==watchToken)return;
  W.eps=eps;
  renderEpList();

  const wantEp=qs.get('ep')&&eps.some(e=>e.id===qs.get('ep'))?qs.get('ep'):(eps[0]&&eps[0].id);
  if(wantEp)selectEpisode(wantEp,qs.get('srv'),tk);
  else stageFail(new Error('This title has no episodes listed.'),null);

  function renderEpList(){
    const box=$('#epBox');
    box.innerHTML=W.eps.map(e=>{
      const v=prog.get(pid+':'+e.id);
      const pc=v&&v.d?v.t/v.d:0;
      return `<button class="epitem ${e.id===W.curEp?'on':''} ${pc>0.92?'seen':''}" data-ep="${e.id}">
        <span class="t">${e.num?`#${esc(e.num)}`:''} ${esc(e.name)}</span><span class="n">${pc>0.03&&pc<=0.92?fmtTime(v.d):''}</span>
      </button>`;
    }).join('');
    
    // Event Delegation for performance
    box.onclick = (e) => {
      const b = e.target.closest('.epitem');
      if(b) selectEpisode(b.dataset.ep, null, watchToken);
    };
  }

  async function selectEpisode(eid,sidPref,tk2){
    if(tk2!==watchToken)return;
    W.curEp=eid;
    renderEpList();
    pmsg('<div class="spin"></div><div>Loading servers...</div>');
    pstatus('');
    let srvs;
    try{srvs=await fetchServers(pid,eid);}
    catch(e){if(tk2===watchToken)stageFail(e,{retry:()=>selectEpisode(eid,sidPref,watchToken)});return;}
    if(tk2!==watchToken)return;
    W.srvs=srvs;
    let pi=srvs.findIndex(s=>s.id===sidPref);
    if(pi<0)pi=srvs.findIndex(s=>s.lang==='sub');
    if(pi<0)pi=0;
    W.curSrvIdx=-1;
    renderServers();
    if(srvs.length)selectServer(pi,tk2);
    else stageFail(new Error('No servers returned for this episode.'),null);
  }

  function renderServers(){
    const box=$('#srvBox');
    const subs=W.srvs.map((s,i)=>({s,i})).filter(x=>x.s.lang==='sub');
    const dubs=W.srvs.map((s,i)=>({s,i})).filter(x=>x.s.lang==='dub');
    const grp=(label,list)=>list.length?`<div class="srvgrp"><div class="lbl">${label}</div>${list.map(x=>`<button class="srv ${x.i===W.curSrvIdx?'on':''}" data-si="${x.i}">${esc(x.s.name)}</button>`).join('')}</div>`:'';
    box.innerHTML=(grp('SUB',subs)+grp('DUB',dubs))||'<span style="color:var(--dim)">None</span>';
    
    // Event Delegation for performance
    box.onclick = (e) => {
      const b = e.target.closest('.srv');
      if(b) selectServer(parseInt(b.dataset.si, 10), watchToken);
    };
  }

  async function selectServer(idx,tk2){
    if(tk2!==watchToken)return;
    const srv=W.srvs[idx];
    if(!srv)return;
    W.curSrvIdx=idx;
    W.curSrv=srv.id;
    renderServers();
    pmsg('<div class="spin"></div><div>Extracting stream...</div>');
    pstatus('');
    let r;
    try{r=await resolveStream(pid,srv.id);}
    catch(e){if(tk2===watchToken)stageFail(e,{retry:()=>selectServer(idx,watchToken)});return;}
    if(tk2!==watchToken)return;
    W.stream=r;
    showVLC(r,tk2);
  }

  function showVLC(r,tk2){
    if(tk2!==watchToken)return;
    const box=$('#playerBox');
    box.innerHTML=`<div class="vlcBox">
      <h3>Ready — open in VLC</h3>
      <div style="color:var(--dim);font-size:13px">Stream extracted. VLC will play it directly (no CORS issues).</div>
      <div class="url">${esc(r.url)}</div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn primary" id="vlcBtn">Open in VLC</button>
        <button class="btn" id="cpy2">Copy .m3u8</button>
        <a class="btn" id="dlBtn" download="stream.m3u">Download .m3u</a>
        <button class="btn" id="popBtn">Browser popup</button>
      </div>
      <div style="color:var(--dim);font-size:12px;margin-top:6px">If nothing happens, copy the URL and paste into VLC → Media → Open Network Stream (Ctrl+N).</div>
    </div>`;
    pmsg('');
    pstatus('VLC ready — '+r.alternates.length+' variant(s)');
    const m3uBlob = new Blob(['#EXTM3U\n'+r.url+'\n'],{type:'audio/x-mpegurl'});
    const m3uUrl = URL.createObjectURL(m3uBlob);
    $('#dlBtn').href=m3uUrl;
    $('#vlcBtn').onclick=()=>{
      const vlcUrl='vlc://'+r.url;
      window.location.href=vlcUrl;
      setTimeout(()=>copyText(r.url,'If VLC did not open, URL copied — paste into VLC (Ctrl+N)'), 2500);
    };
    $('#cpy2').onclick=()=>copyText(r.url,'Stream URL copied');
    $('#popBtn').onclick=()=>window.open(r.embed,'anilabpop','width=940,height=600');
  }

  function stageFail(err,retry){
    pmsg(`<div class="errbox"><b>Stream error</b><br><span style="color:var(--dim)">${esc(err.message||err)}</span>
      <div class="btnrow">
        ${retry?'<button class="btn primary" id="eret">Retry</button>':''}
        <a class="btn" href="https://play.anidb.app/" target="_blank" rel="noopener">Open origin</a>
      </div></div>`);
    pstatus('failed');
    const rb=$('#eret');
    if(rb)rb.onclick=retry;
  }

  setTimeout(()=>{
    const pr=$('#btnPrevEp'),nx=$('#btnNextEp');
    if(pr)pr.onclick=()=>stepEp(-1);
    if(nx)nx.onclick=()=>stepEp(1);
  },0);
  function stepEp(dir){
    const i=W.eps.findIndex(e=>e.id===W.curEp);
    const nx=W.eps[i+dir];
    if(nx)selectEpisode(nx.id,null,watchToken);
  }
}

function route(){
  const raw=location.hash.replace(/^#\/?/,'');
  const qi=raw.indexOf('?');
  const seg=(qi>=0?raw.slice(0,qi):raw).split('/').filter(Boolean);
  const qs=new URLSearchParams(qi>=0?raw.slice(qi+1):'');
  const s0=seg[0]||'home';
  const page=Math.max(1,parseInt(qs.get('page')||'1',10)||1);
  if(cleanupFn){try{cleanupFn()}catch(e){}cleanupFn=null;}
  if(s0!=='watch')killPlayer();
  switch(s0){
    case 'home':viewHome();break;
    case 'latest':viewGrid(()=>api.latest(page),'#/latest?page',page,'Latest releases');break;
    case 'categories':viewCategories();break;
    case 'category':viewCategory(seg[1],qs.get('name')||'',page);break;
    case 'search':viewSearch(qs.get('q')||'',page);break;
    case 'post':viewPost(seg[1]);break;
    case 'watch':viewWatch(seg[1],qs);break;
    case 'mylist':viewMyList();break;
    default:viewHome();
  }
}
window.route=route;
window.addEventListener('hashchange',route);
 $('#searchForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('#q').value.trim();
  if(v)location.hash='#/search?q='+encodeURIComponent(v)+'&page=1';
});
route();
</script>
