[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nightfall"
version = "1.0.0"
description = "🌙 Nightfall — Private Cinema Gateway: unified MovieBox + Anime (Anilab2/Kyoto) API, TUI, CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pydantic>=2.5",
  "textual>=0.44",
  "rich>=13.0",
]

[project.scripts]
nightfall = "nightfall.cli:main"
nf = "nightfall.cli:main"

[tool.setuptools.packages.find]
include = ["nightfall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
